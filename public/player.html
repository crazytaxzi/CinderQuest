<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cinder Player Stage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Oxanium:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="app-page player-page">
  <div class="page-projector" aria-hidden="true"></div>
  <section id="setup" class="card setup-screen">
    <span class="eyebrow">Visible YouTube player</span>
    <h1>Prime the player stage.</h1>
    <p class="muted">Enter the admin token, then click once to unlock browser playback. Keep this player visible; do not bury YouTube behind an overlay.</p>
    <form id="setup-form" class="form-grid">
      <label>Admin token<input id="player-token" type="password" required></label>
      <button class="primary">Unlock and Start</button>
      <div id="setup-status" class="status"></div>
    </form>
  </section>

  <main id="player-shell" class="player-shell" hidden>
    <section class="player-stage">
      <div id="youtube-player"></div>
    </section>
    <footer class="card player-footer">
      <div id="player-now">
        <strong>Waiting for a track.</strong>
        <div class="small">Use the dashboard or let the fallback playlist take over.</div>
      </div>
      <div class="controls">
        <button id="local-play" class="primary">Play</button>
        <button id="local-pause" class="ghost">Pause</button>
        <button id="local-next" class="danger">Next</button>
      </div>
    </footer>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/player.js"></script>
</body>
</html>
